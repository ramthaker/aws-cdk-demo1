name: CDK CI/CD (OIDC)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: cdk-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1         # change region if needed
  CDK_STACK: StaticSiteStack    # optional: a single stack to deploy. Use --all if you prefer

jobs:
  synth:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (TypeScript)
        run: npm run build

      - name: Run CDK synth (PR check)
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: npx cdk synth --no-staging

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [synth]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (TypeScript)
        run: npm run build

      - name: Configure AWS credentials via OIDC (assume role)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}   # the role ARN (stored as a repo secret)
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 900

      - name: CDK bootstrap (optional)
        run: npx cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }} || true

      - name: CDK deploy
        # For automated deploys: use --require-approval never or limit to a stack
        run: npx cdk deploy ${CDK_STACK:---all} --require-approval never
